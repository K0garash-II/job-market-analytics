services:

  postgres:
    image: postgres:16-alpine
    container_name: jobmarket_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobmarket
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d jobmarket"]
      interval: 5s
      timeout: 5s
      retries: 5

  retention:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: jobmarket
      PGUSER: app
      PGPASSWORD: secret
      PGCONNECT_TIMEOUT: 5
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          if removed=$$(psql -XAt -v ON_ERROR_STOP=1 -c 'SELECT prune_expired_vacancies()'); then
            if [ "$$removed" != 0 ]; then echo "Expired vacancies removed: $$removed"; fi
          fi
          sleep 60
        done

  redis:
    image: redis:7-alpine
    container_name: jobmarket_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  nats:
    image: nats:2-alpine
    container_name: jobmarket_nats
    restart: unless-stopped
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    command: ["--jetstream", "--store_dir=/data"]
    volumes:
      - nats_data:/data

volumes:
  pg_data:
  redis_data:
  nats_data:
